<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Un mensaje para Ariadna</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at center, #ff7799, #e83b70 45%, #8e174f);
    }

    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -12vh;
      color: rgba(255, 255, 255, .22);
      font-size: clamp(24px, 5vw, 72px);
      animation: float-up linear infinite;
      filter: drop-shadow(0 4px 10px rgba(110, 0, 45, .15));
    }

    .heart:nth-child(1) { left: 5%; animation-duration: 12s; animation-delay: -3s; }
    .heart:nth-child(2) { left: 17%; font-size: 38px; animation-duration: 16s; animation-delay: -11s; }
    .heart:nth-child(3) { left: 31%; animation-duration: 14s; animation-delay: -7s; }
    .heart:nth-child(4) { left: 47%; font-size: 46px; animation-duration: 18s; animation-delay: -13s; }
    .heart:nth-child(5) { left: 63%; animation-duration: 13s; animation-delay: -5s; }
    .heart:nth-child(6) { left: 78%; font-size: 34px; animation-duration: 17s; animation-delay: -9s; }
    .heart:nth-child(7) { left: 91%; animation-duration: 15s; animation-delay: -2s; }
    .heart:nth-child(8) { left: 39%; font-size: 30px; animation-duration: 20s; animation-delay: -16s; }

    @keyframes float-up {
      0% { transform: translateY(0) rotate(-12deg); opacity: 0; }
      12% { opacity: 1; }
      88% { opacity: .8; }
      100% { transform: translateY(-125vh) rotate(18deg); opacity: 0; }
    }

    main {
      position: relative;
      z-index: 1;
      width: min(90vw, 760px);
      padding: clamp(2rem, 7vw, 5rem) 1.5rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 28px;
      background: rgba(91, 8, 48, .23);
      box-shadow: 0 24px 80px rgba(75, 0, 35, .25),
                  inset 0 1px rgba(255, 255, 255, .18);
      backdrop-filter: blur(8px);
    }

    .tiny-heart { font-size: 2.5rem; margin: 0 0 .8rem; }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 9vw, 6.5rem);
      line-height: .98;
      letter-spacing: -.055em;
      text-shadow: 0 5px 24px rgba(85, 0, 35, .3);
    }

    p {
      margin: 1.2rem 0 0;
      font-size: clamp(1rem, 2.8vw, 1.25rem);
      color: rgba(255, 255, 255, .85);
    }

    @media (prefers-reduced-motion: reduce) {
      .heart { animation: none; bottom: auto; top: 10%; }
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart">♥</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="heart">♥</span>
    <span class="heart">♥</span><span class="heart">♥</span>
  </div>

  <main>
    <div class="tiny-heart" aria-hidden="true">♥</div>
    <h1>Ariadna,<br>te odio</h1>
    <p>(Busca de Dios, cambia.)</p>
  </main>
</body>
</html>
